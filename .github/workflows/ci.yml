name: SNN-Abacus-Core CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"

# Kota koruması (2026-09-20): aynı dala arka arkaya gönderim yapılınca biten
# olmayan eski koşum iptal edilir. main'de iptal YOK — ana dalın her commit'i
# doğrulanmış kalmalı.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Beceri ve issue sablonu butunluk kontrolu
        run: npm run beceri:dogrula

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest unit tests (kapsam esikleri ile)
        run: npm run test:coverage
