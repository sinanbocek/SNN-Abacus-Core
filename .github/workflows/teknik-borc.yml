# Her projeye kopyalanacak TEK dosya: .github/workflows/teknik-borc.yml
# Kütük main'e ulaştığında (ve günde bir kez) ortak görevliyi çalıştırır.
name: teknik-borc

on:
  push:
    branches: [main]
    paths:
      - docs/teknik-borc.md
      - docs/teknik-borc-arsiv.md
  schedule:
    - cron: "17 4 * * 1" # her pazartesi 07:17 TSİ — kayma temizliği
      # 2026-09-20: günlükten haftalığa. 10 depoda günlük koşum ayda ~300
      # koşum demekti; kütük main'e ulaştığında zaten koşuyor, bu yalnız
      # kayma temizliği. Actions kotası için haftalığa çekildi.
  workflow_dispatch:
    inputs:
      uygula:
        description: "İşaretsizse yalnız kuru çalıştırma"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: teknik-borc
  cancel-in-progress: false

jobs:
  senkron:
    uses: sinanbocek/snn-standartlar/.github/workflows/borc-senkron.yml@main
    with:
      uygula: ${{ github.event_name != 'workflow_dispatch' || inputs.uygula }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
